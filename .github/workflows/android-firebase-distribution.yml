name: Android CI/CD Firebase Distribution

on:
    push:
        branches:
            - main
            - develop
    workflow_dispatch:

jobs:
    android-release:
        name: Build and Distribute Android APK
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: .

        steps:
            - name: Code Push (Checkout)
              uses: actions/checkout@v4

            - name: Detect project paths
              id: paths
              run: |
                  if [ -d "android" ] && [ -f "package.json" ]; then
                    APP_DIR="."
                    ANDROID_DIR="android"
                    APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
                  elif [ -d "bitenex-user/android" ] && [ -f "bitenex-user/package.json" ]; then
                    APP_DIR="bitenex-user"
                    ANDROID_DIR="bitenex-user/android"
                    APK_PATH="bitenex-user/android/app/build/outputs/apk/release/app-release.apk"
                  else
                    echo "Cannot locate project paths. Expected either ./android or ./bitenex-user/android" >&2
                    exit 1
                  fi

                  echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
                  echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"
                  echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            - name: Setup Android SDK
              uses: android-actions/setup-android@v3

            - name: Install Android SDK packages
              run: |
                  sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
                  sdkmanager --licenses

            - name: Install Dependencies
              working-directory: ${{ steps.paths.outputs.app_dir }}
              run: |
                  if [ -f package-lock.json ]; then
                    npm ci --include=dev
                  else
                    echo "package-lock.json not found, falling back to npm install"
                    npm install --include=dev
                  fi

            - name: Detect optional scripts
              id: script-check
              working-directory: ${{ steps.paths.outputs.app_dir }}
              run: |
                  HAS_LINT=$(node -e "const p=require('./package.json'); process.stdout.write(p.scripts && p.scripts.lint ? 'true' : 'false')")
                  HAS_TEST=$(node -e "const p=require('./package.json'); process.stdout.write(p.scripts && p.scripts.test ? 'true' : 'false')")
                  echo "has_lint=$HAS_LINT" >> "$GITHUB_OUTPUT"
                  echo "has_test=$HAS_TEST" >> "$GITHUB_OUTPUT"

            - name: Lint (Basic)
              if: steps.script-check.outputs.has_lint == 'true'
              working-directory: ${{ steps.paths.outputs.app_dir }}
              run: npm run lint

            - name: Unit Test (if available)
              if: steps.script-check.outputs.has_test == 'true'
              working-directory: ${{ steps.paths.outputs.app_dir }}
              run: npm test -- --ci

            - name: Prepare local.properties
              working-directory: ${{ steps.paths.outputs.android_dir }}
              run: |
                  echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

            - name: Build App (assembleRelease)
              working-directory: ${{ steps.paths.outputs.android_dir }}
              env:
                  NODE_ENV: production
              run: |
                  chmod +x gradlew
                  ./gradlew assembleRelease --no-daemon

            - name: Verify APK output
              run: ls -lh "$(dirname '${{ steps.paths.outputs.apk_path }}')"

            - name: Upload Artifact to Firebase App Distribution
              uses: wzieba/Firebase-Distribution-Github-Action@v1
              with:
                  appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
                  serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
                  groups: ${{ secrets.FIREBASE_TESTER_GROUPS }}
                  file: ${{ steps.paths.outputs.apk_path }}
                  releaseNotes: |
                      CI build from commit ${{ github.sha }}
                      Branch: ${{ github.ref_name }}
                      Triggered by: ${{ github.actor }}
